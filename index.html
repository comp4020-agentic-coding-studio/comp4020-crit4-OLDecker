<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pond — an instrument</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
    </header>
    <main>
      <h1>Pond</h1>
      <div
        class="pond"
        id="pond"
        aria-label="A pond instrument. Drag a lily pad, or focus one and use the arrow keys, to change its pitch, timing and stereo position."
      >
        <div class="ripple" aria-hidden="true"></div>
        <img
          class="pond-decor"
          src="./assets/rock.png"
          alt=""
          aria-hidden="true"
          style="width: 3rem; top: 8%; left: 12%"
        />
        <img
          class="pond-decor"
          src="./assets/shore-tile.png"
          alt=""
          aria-hidden="true"
          style="width: 5rem; top: 4%; left: 68%"
        />
        <img
          class="pond-decor"
          src="./assets/rock.png"
          alt=""
          aria-hidden="true"
          style="width: 2.2rem; top: 82%; left: 85%"
        />
        <img
          class="pond-decor"
          src="./assets/shore-tile.png"
          alt=""
          aria-hidden="true"
          style="width: 4.5rem; top: 86%; left: 20%"
        />
        <button
          type="button"
          class="lily-pad"
          role="slider"
          aria-label="Frog lily pad"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="65"
          aria-valuetext="pitch 65 of 100, panned centre"
          data-distance="0.35"
          data-angle="0"
        >
          <img src="./assets/frog.png" alt="" aria-hidden="true" />
        </button>
        <button
          type="button"
          class="lily-pad"
          role="slider"
          aria-label="Duck lily pad"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="45"
          aria-valuetext="pitch 45 of 100, panned right"
          data-distance="0.55"
          data-angle="45"
        >
          <img src="./assets/duck.png" alt="" aria-hidden="true" />
        </button>
        <button
          type="button"
          class="lily-pad"
          role="slider"
          aria-label="Fish lily pad"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="25"
          aria-valuetext="pitch 25 of 100, panned right"
          data-distance="0.75"
          data-angle="90"
        >
          <img src="./assets/fish.png" alt="" aria-hidden="true" />
        </button>
        <button
          type="button"
          class="lily-pad pixel-art"
          role="slider"
          aria-label="Lotus lily pad"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="60"
          aria-valuetext="pitch 60 of 100, panned right"
          data-distance="0.4"
          data-angle="135"
        >
          <img src="./assets/lotus.png" alt="" aria-hidden="true" />
        </button>
        <button
          type="button"
          class="lily-pad"
          role="slider"
          aria-label="Rabbit lily pad"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="40"
          aria-valuetext="pitch 40 of 100, panned centre"
          data-distance="0.6"
          data-angle="180"
        >
          <img src="./assets/rabbit.png" alt="" aria-hidden="true" />
        </button>
        <button
          type="button"
          class="lily-pad"
          role="slider"
          aria-label="Owl lily pad"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="20"
          aria-valuetext="pitch 20 of 100, panned left"
          data-distance="0.8"
          data-angle="225"
        >
          <img src="./assets/owl.png" alt="" aria-hidden="true" />
        </button>
        <button
          type="button"
          class="lily-pad pixel-art"
          role="slider"
          aria-label="Mushroom lily pad"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="55"
          aria-valuetext="pitch 55 of 100, panned left"
          data-distance="0.45"
          data-angle="270"
        >
          <img src="./assets/mushroom.png" alt="" aria-hidden="true" />
        </button>
      </div>
    </main>
    <footer>
      <p><small>Art: Kenney.nl (CC0 1.0)</small></p>
    </footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
