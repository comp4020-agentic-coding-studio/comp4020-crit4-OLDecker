<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pond — an instrument</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
    </header>
    <main>
      <h1>Pond</h1>
      <div
        class="pond"
        id="pond"
        aria-label="A pond instrument. Drag a lily pad, or focus one and use the arrow keys, to change its pitch, timing and stereo position."
      >
        <div class="ripple" aria-hidden="true"></div>
        <button
          type="button"
          class="lily-pad"
          role="slider"
          aria-label="Large lily pad"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="65"
          aria-valuetext="pitch 65 of 100, panned centre"
          data-distance="0.35"
          data-angle="0"
          data-model="lily_large"
        ></button>
        <button
          type="button"
          class="lily-pad"
          role="slider"
          aria-label="Small lily pad"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="45"
          aria-valuetext="pitch 45 of 100, panned right"
          data-distance="0.55"
          data-angle="45"
          data-model="lily_small"
        ></button>
        <button
          type="button"
          class="lily-pad"
          role="slider"
          aria-label="Red mushroom"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="25"
          aria-valuetext="pitch 25 of 100, panned right"
          data-distance="0.75"
          data-angle="90"
          data-model="mushroom_red"
        ></button>
        <button
          type="button"
          class="lily-pad"
          role="slider"
          aria-label="Purple flower"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="60"
          aria-valuetext="pitch 60 of 100, panned right"
          data-distance="0.4"
          data-angle="135"
          data-model="flower_purpleA"
        ></button>
        <button
          type="button"
          class="lily-pad"
          role="slider"
          aria-label="Tree stump"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="40"
          aria-valuetext="pitch 40 of 100, panned centre"
          data-distance="0.6"
          data-angle="180"
          data-model="stump_round"
        ></button>
        <button
          type="button"
          class="lily-pad"
          role="slider"
          aria-label="Flat rock"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="20"
          aria-valuetext="pitch 20 of 100, panned left"
          data-distance="0.8"
          data-angle="225"
          data-model="rock_smallFlatA"
        ></button>
        <button
          type="button"
          class="lily-pad"
          role="slider"
          aria-label="Tan mushroom"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="55"
          aria-valuetext="pitch 55 of 100, panned left"
          data-distance="0.45"
          data-angle="270"
          data-model="mushroom_tan"
        ></button>
      </div>
    </main>
    <footer>
      <p><small>3D models &amp; art: Kenney.nl (CC0 1.0)</small></p>
    </footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
